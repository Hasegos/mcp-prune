<title>수금이 리포트 무대</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#FBF6EC; --surface:#FFFFFF; --text:#3A2E22; --text-dim:#7A6A57;
    --accent:#E0A233; --line:#E7D9BF;
    --coat:#F1E1C8; --patch:#9B9187; --tan:#C08A55; --ink:#35281F; --blush:#E8AFA5;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#231D17; --surface:#2C241D; --text:#F3E9DA; --text-dim:#C9B79E;
      --accent:#EFB94D; --line:#473A2C;
      --coat:#E6CDA6; --patch:#847969; --tan:#AE7C48; --ink:#1B140E; --blush:#D89A90;
    }
  }
  :root[data-theme="dark"]{
    --bg:#231D17; --surface:#2C241D; --text:#F3E9DA; --text-dim:#C9B79E;
    --accent:#EFB94D; --line:#473A2C;
    --coat:#E6CDA6; --patch:#847969; --tan:#AE7C48; --ink:#1B140E; --blush:#D89A90;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:"Noto Sans KR",sans-serif; padding-inline:16px; padding-block:28px;}
  .wrap{max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:14px;}
  .lead{color:var(--text-dim); font-size:12.5px; margin:0; line-height:1.5;}

  .stage{
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:20px; display:flex; flex-direction:column; align-items:center; gap:14px;
    position:relative; overflow:hidden;
  }
  .stage-floor{width:100%; height:1px; background:var(--line); margin-top:-4px;}
  .state-chip{
    font-size:12px; color:var(--accent); border:1px solid var(--accent); border-radius:999px;
    padding:3px 10px; font-weight:500; align-self:flex-start;
  }
  .mascot-svg{width:180px; height:auto; shape-rendering:crispEdges; overflow:visible;}
  .bubble{
    font-family:"Gaegu",sans-serif; font-size:16px; line-height:1.5; text-align:center;
    background:var(--bg); border:2px solid var(--line); border-radius:16px; padding:10px 16px;
    max-width:400px; min-height:1.6em; transition:opacity .25s ease;
  }
  .bubble small{display:block; font-family:"Noto Sans KR",sans-serif; font-size:11px; color:var(--text-dim); margin-top:4px;}

  /* --- 캐릭터 리그: 각 부위를 개별 그룹으로 분리해 상태별로 독립 애니메이션 --- */
  .mascot{ transform-box:fill-box; }
  .earL,.earR,.tail,.pawL,.eyes{ transform-box:fill-box; }
  .earL{ transform-origin:85% 100%; }
  .earR{ transform-origin:85% 100%; }
  .tail{ transform-origin:0% 30%; }
  .pawL{ transform-origin:50% 0%; }
  .eyes{ transform-origin:50% 50%; }
  .mouth{ opacity:0; transition:opacity .1s; }

  @keyframes earWiggle{ 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(-8deg);} }
  @keyframes tailWag{ 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(18deg);} }
  @keyframes blink{ 0%,90%,100%{transform:scaleY(1);} 95%{transform:scaleY(0.15);} }
  @keyframes hopIn{
    0%{transform:translate(-60px,0);} 60%{transform:translate(2px,-6px);}
    80%{transform:translate(-1px,1px);} 100%{transform:translate(0,0);}
  }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-1.5px);} }
  @keyframes pawPoint{ 0%,100%{transform:rotate(0deg) translate(0,0);} 100%{transform:rotate(-70deg) translate(-1px,-3px);} }
  @keyframes talkMouth{ 0%,100%{opacity:0;} 50%{opacity:1;} }

  .pose-idle .mascot{ animation:bob 2.6s ease-in-out infinite; }
  .pose-idle .earL{ animation:earWiggle 3.4s ease-in-out infinite; }
  .pose-idle .earR{ animation:earWiggle 3.4s ease-in-out infinite; }
  .pose-idle .tail{ animation:tailWag 2.2s ease-in-out infinite; }
  .pose-idle .eyes{ animation:blink 4.5s steps(1) infinite; }

  .pose-walk .mascot{ animation:hopIn .9s steps(6,end) 1, bob .5s ease-in-out infinite .9s; }
  .pose-walk .earL{ animation:earWiggle 1.1s ease-in-out infinite; }
  .pose-walk .earR{ animation:earWiggle 1.1s ease-in-out infinite; }
  .pose-walk .tail{ animation:tailWag .7s steps(3,end) infinite; }

  .pose-point .mascot{ animation:bob 2.6s ease-in-out infinite; }
  .pose-point .pawL{ animation:pawPoint .35s steps(3,end) forwards; }
  .pose-point .earL{ transform:rotate(-14deg); }
  .pose-point .earR{ transform:rotate(-14deg); }
  .pose-point .tail{ animation:tailWag 1.4s ease-in-out infinite; }

  .pose-talk .mascot{ animation:bob 1.8s ease-in-out infinite; }
  .pose-talk .mouth{ animation:talkMouth .5s steps(1,end) infinite; }
  .pose-talk .earL{ animation:earWiggle 1.8s ease-in-out infinite; }
  .pose-talk .earR{ animation:earWiggle 1.8s ease-in-out infinite; }
  .pose-talk .tail{ animation:tailWag 1s ease-in-out infinite; }
  .pose-talk .pawL{ transform:rotate(-70deg) translate(-1px,-3px); }

  @media (prefers-reduced-motion:reduce){
    .mascot,.earL,.earR,.tail,.pawL,.eyes,.mouth{ animation:none !important; transform:none !important; }
  }
</style>

<div class="wrap">
  <p class="lead">mcp-prune 리포트 도우미 "수금이" — 위 표의 최악 offender를 짚어가며 설명해요.</p>

  <div class="stage" id="stage">
    <span class="state-chip" id="stateChip">지금: 인사하는 중</span>
    <svg class="mascot-svg" id="mascotSvg" viewBox="0 0 18 16" role="img" aria-label="수금이 마스코트"></svg>
    <div class="stage-floor"></div>
    <div class="bubble" id="bubble"></div>
  </div>
</div>

<script>
/**
 * 팔레트 문자 → CSS 변수 매핑.
 */
const PAL = { c:'var(--coat)', g:'var(--patch)', t:'var(--tan)', k:'var(--ink)', p:'var(--blush)' };

/**
 * run-length 형식의 한 행(row)을 SVG <rect> 마크업으로 변환한다.
 * @param {number} y - 행의 y좌표(그리드 단위)
 * @param {Array<[number,string]>} runs - [칸 수, 팔레트 문자] 쌍의 배열. '.'은 빈 칸.
 * @returns {string} 해당 행의 rect 마크업 문자열
 */
function rowRects(y, runs){
  let x = 0, out = '';
  for (const [n, ch] of runs){
    if (ch !== '.') out += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${PAL[ch]}"/>`;
    x += n;
  }
  return out;
}

/**
 * 여러 행(run-length 배열)을 이어붙여 하나의 SVG 마크업 블록으로 변환한다.
 * @param {number} startY - 첫 행의 y좌표
 * @param {Array<Array<[number,string]>>} rows - 행 배열
 * @returns {string} 합쳐진 rect 마크업 문자열
 */
function block(startY, rows){
  return rows.map((r, i) => rowRects(startY + i, r)).join('');
}

// 얼굴/몸통(정적 파트) — y=3부터 시작
const BODY_ROWS = [
  [[6,'.'],[6,'c'],[6,'.']],
  [[4,'.'],[10,'c'],[4,'.']],
  [[3,'.'],[12,'c'],[3,'.']],
  [[3,'.'],[12,'c'],[3,'.']],
  [[3,'.'],[12,'c'],[3,'.']],
  [[4,'.'],[3,'c'],[4,'t'],[3,'c'],[4,'.']],
  [[4,'.'],[2,'c'],[2,'t'],[2,'k'],[2,'t'],[2,'c'],[4,'.']],
  [[4,'.'],[3,'c'],[4,'t'],[3,'c'],[4,'.']],
  [[5,'.'],[8,'c'],[5,'.']],
  [[4,'.'],[10,'c'],[4,'.']],
  [[2,'.'],[3,'c'],[8,'g'],[3,'c'],[2,'.']],
  [[2,'.'],[3,'c'],[8,'g'],[3,'c'],[2,'.']],
  [[3,'.'],[2,'.'],[8,'c'],[2,'t'],[3,'.']],
];

// 귀(로컬 6x6 그리드, 왼쪽 기준 — 오른쪽은 좌우반전으로 재사용)
const EAR_ROWS = [
  [[1,'.'],[3,'g'],[2,'.']],
  [[4,'g'],[2,'.']],
  [[5,'g'],[1,'.']],
  [[5,'g'],[1,'.']],
  [[4,'g'],[2,'.']],
  [[3,'g'],[3,'.']],
];

/**
 * 수금이 한 마리 분량의 SVG 내용을 조립한다. 파트별로 <g> 로 감싸 CSS 애니메이션 훅을 제공한다.
 * 위치(translate/scale)는 바깥쪽 <g>의 SVG 속성으로, 회전 애니메이션은 안쪽 <g>의 CSS 클래스로 분리한다 —
 * 같은 요소에 CSS transform과 SVG transform 속성을 동시에 걸면 CSS가 속성을 완전히 덮어써 버리기 때문.
 * @returns {string} <svg> 내부에 삽입할 마크업
 */
function buildMascot(){
  const body = block(3, BODY_ROWS);
  const eyes = `<rect x="6" y="6" width="1" height="1" fill="${PAL.k}"/><rect x="11" y="6" width="1" height="1" fill="${PAL.k}"/>`;
  const blush = `<rect x="4" y="8" width="1" height="1" fill="${PAL.p}" opacity=".7"/><rect x="13" y="8" width="1" height="1" fill="${PAL.p}" opacity=".7"/>`;
  const mouth = `<rect x="8" y="10" width="2" height="1" fill="${PAL.k}"/>`;
  const earLocal = block(0, EAR_ROWS);
  const tail = `<rect x="15" y="12" width="2" height="1" fill="${PAL.c}"/><rect x="16" y="13" width="2" height="2" fill="${PAL.c}"/><rect x="17" y="12" width="1" height="1" fill="${PAL.g}"/>`;
  const pawL = `<rect x="4" y="13" width="2" height="1" fill="${PAL.t}"/><rect x="4" y="14" width="2" height="1" fill="${PAL.t}"/><rect x="4" y="15" width="2" height="1" fill="${PAL.t}"/>`;

  return `<g class="mascot">`
    + body
    + `<g class="eyes">${eyes}</g>`
    + blush
    + `<g class="mouth">${mouth}</g>`
    + `<g transform="translate(2,0)"><g class="earL">${earLocal}</g></g>`
    + `<g transform="translate(16,0) scale(-1,1)"><g class="earR">${earLocal}</g></g>`
    + `<g class="tail">${tail}</g>`
    + `<g class="pawL">${pawL}</g>`
    + `</g>`;
}

/**
 * 배 까고 뒹굴기(belly-up) 정적 포즈를 그린다 — 전부 🟢 유지 판정일 때 마무리로 쓴다.
 * @returns {string} <svg> 내부 마크업
 */
function buildBellyUp(){
  const rows = [
    [[3,'.'],[2,'t'],[2,'.'],[6,'.'],[2,'.'],[2,'t'],[1,'.']],
    [[4,'.'],[10,'c'],[4,'.']],
    [[3,'.'],[3,'g'],[6,'c'],[3,'g'],[3,'.']],
    [[3,'.'],[12,'c'],[3,'.']],
    [[3,'.'],[3,'c'],[6,'g'],[3,'c'],[3,'.']],
    [[4,'.'],[10,'c'],[4,'.']],
    [[5,'.'],[8,'c'],[5,'.']],
    [[6,'.'],[6,'c'],[6,'.']],
    [[6,'.'],[3,'c'],[3,'t'],[6,'.']],
  ];
  const body = block(2, rows);
  const eye = `<rect x="9" y="9" width="1" height="1" fill="${PAL.k}"/>`;
  const tongue = `<rect x="9" y="11" width="1" height="1" fill="${PAL.p}"/>`;
  return body + eye + tongue;
}

/**
 * 이불 파묻기(blanket-peek) 정적 포즈를 그린다 — 설정된 MCP 서버가 하나도 없을 때 쓴다.
 * @returns {string} <svg> 내부 마크업
 */
function buildBlanketPeek(){
  const blanket = `<rect x="1" y="9" width="16" height="6" rx="1" fill="var(--accent)" opacity=".85"/>`
    + `<rect x="1" y="9" width="16" height="2" fill="var(--accent)"/>`;
  const earL = `<g transform="translate(4,3)">${block(0, EAR_ROWS)}</g>`;
  const earR = `<g transform="translate(15,3) scale(-1,1)">${block(0, EAR_ROWS)}</g>`;
  const head = block(4, [
    [[6,'.'],[6,'c'],[6,'.']],
    [[4,'.'],[10,'c'],[4,'.']],
    [[3,'.'],[12,'c'],[3,'.']],
    [[3,'.'],[12,'c'],[3,'.']],
  ]);
  const eyes = `<rect x="6" y="7" width="1" height="1" fill="${PAL.k}"/><rect x="11" y="7" width="1" height="1" fill="${PAL.k}"/>`;
  const nose = `<rect x="8" y="8" width="2" height="1" fill="${PAL.k}"/>`;
  return earL + earR + head + eyes + nose + blanket;
}

document.getElementById('mascotSvg').innerHTML = buildMascot();

/**
 * report.py의 build_rows() 출력을 그대로 옮겨 담는 자리.
 * 이 스킬을 실행하는 Claude가 이번 /mcp-prune:run 결과의 실제 값으로 매번 교체한다.
 * 절대 샘플 수치를 남겨둔 채로 발행하지 않는다.
 */
const REPORT_DATA = {
  servers: [
    { name:'playwright', cost:4518, calls:0, lastUsed:'사용 안 함', roi:4518, verdict:'remove' },
    { name:'notion', cost:2100, calls:3, lastUsed:'2일 전', roi:700, verdict:'review' },
    { name:'github', cost:1200, calls:45, lastUsed:'오늘', roi:27, verdict:'keep' },
  ],
};

/**
 * 리포트 데이터로부터 무대 시퀀스(등장 → 최악 offender별 콕 짚기·설명 → 마무리)를 만든다.
 * 서버가 없으면 이불 파묻기로, 전부 keep이면 배 까고 뒹굴기로 마무리한다.
 * @param {{servers: Array<{name:string,cost:number,calls:number,lastUsed:string,roi:number,verdict:string}>}} data
 * @returns {Array<{cls:string,label:string,text:string}>}
 */
function buildSequenceFromReport(data){
  const servers = data.servers;
  if (servers.length === 0){
    return [{ cls:'pose-rest-peek', label:'지금: 조용히 대기 중', text:'지금은 걷을 빚이 하나도 없어요, MCP 서버가 없네요' }];
  }
  const worst = [...servers].sort((a, b) => b.roi - a.roi).slice(0, 3);
  const seq = [
    { cls:'pose-idle', label:'지금: 인사하는 중', text:'수금하러 왔습니다! 리포트 가져왔어요~' },
    { cls:'pose-walk', label:'지금: 통통 등장', text:'짜잔, 표 옆으로 폴짝!' },
  ];
  for (const s of worst){
    const roiTxt = s.calls === 0 ? '호출 0번' : `호출 ${s.calls}번, ROI ${s.roi.toLocaleString()}`;
    seq.push({ cls:'pose-point', label:`지금: ${s.name} 콕 짚는 중`, text:`${s.name}, 이 서버 좀 봐주세요` });
    seq.push({ cls:'pose-talk', label:'지금: 설명하는 중', text:`토큰 ${s.cost.toLocaleString()}개 쓰는데 ${roiTxt}, 마지막 사용 ${s.lastUsed}이에요` });
  }
  const allGreen = servers.every(s => s.verdict === 'keep');
  seq.push(allGreen
    ? { cls:'pose-rest-belly', label:'지금: 축하하는 중', text:'전부 알뜰하게 쓰고 계셨네요, 수금할 거 없어요!' }
    : { cls:'pose-idle', label:'지금: 인사하는 중', text:'말씀드린 서버들 한번 정리해봐요' });
  return seq;
}

/* --- 무대 상태 순환: 리포트 데이터 기반 시퀀스를 반복 재생 --- */
const stage = document.getElementById('stage');
const chip = document.getElementById('stateChip');
const bubble = document.getElementById('bubble');
const sequence = buildSequenceFromReport(REPORT_DATA);
let idx = 0;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const mascotSvg = document.getElementById('mascotSvg');
const RIGGED_MARKUP = mascotSvg.innerHTML; // 리깅된 기본 캐릭터(귀/꼬리/앞발 애니메이션 포함)를 보존해둔다

/**
 * 무대의 현재 포즈를 다음 시퀀스로 전환한다. reduced-motion 환경에서는 첫 포즈에 고정.
 * pose-rest-peek / pose-rest-belly 상태에서는 리깅 캐릭터 대신 보너스 정적 포즈로 무대를 바꾼다.
 */
function nextPose(){
  const cur = sequence[idx];
  stage.className = 'stage ' + cur.cls;
  chip.textContent = cur.label;
  if (cur.cls === 'pose-rest-peek') mascotSvg.innerHTML = buildBlanketPeek();
  else if (cur.cls === 'pose-rest-belly') mascotSvg.innerHTML = buildBellyUp();
  else if (mascotSvg.innerHTML !== RIGGED_MARKUP) mascotSvg.innerHTML = RIGGED_MARKUP;
  bubble.style.opacity = 0;
  setTimeout(() => {
    bubble.textContent = cur.text;
    bubble.style.opacity = 1;
  }, 200);
  idx = (idx + 1) % sequence.length;
}
nextPose();
if (!reduceMotion) setInterval(nextPose, 2600);
</script>
